name: CI — Deterministic Linter, Universal Domain Tests & Claude Bridge

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Node 22 Unit Tests (38/38) & Universal Compiler Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 38 Deterministic Linter, Taxonomy & Universal Domain Unit Tests
        run: node --experimental-strip-types --test src/utils/pipeline.test.ts src/utils/ictTaxonomy.test.ts src/utils/driveHelpers.test.ts src/utils/domainProfiles.test.ts

      - name: Verify Universal YouTube Ingestion CLI (35m Slicing & Prompt Generation)
        run: python scripts/universal_youtube_ingest.py --url "https://www.youtube.com/watch?v=dQw4w9WgXcQ" --title "Distributed Consensus & State Machine Replication" --channel "MIT OpenCourseWare" --duration 4500 --domain SOFTWARE_AND_ALGORITHMS

      - name: Verify Universal Claude Code Compiler Bridge (Python, TypeScript & Course Handbook Targets)
        run: |
          python scripts/claude_agent_bridge.py --input "fiches/etalons/HugoFX_Fiche_ETALON_BPR_dg2-OsUXN60.md" --target python
          python scripts/claude_agent_bridge.py --input "fiches/etalons/HugoFX_Fiche_ETALON_BPR_dg2-OsUXN60.md" --target typescript
          python scripts/claude_agent_bridge.py --input "fiches/etalons/HugoFX_Fiche_ETALON_BPR_dg2-OsUXN60.md" --target course-handbook
